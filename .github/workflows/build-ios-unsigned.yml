name: build-ios-unsigned
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Reloc.xcodeproj -scheme Reloc -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DD build
      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Reloc-1.0-ios16-test-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Reloc-IPA
          path: Reloc-1.0-ios16-test-ios-unsigned.ipa
